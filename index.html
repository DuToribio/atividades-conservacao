<head>

<style>
  :root{
    --coral:#FF5246; --coral-soft:#FFE3E0; --grafite:#4B4B4B; --areia:#EDE9E5;
    --white:#FFFFFF; --dark:#181818; --verde:#32CAA0; --verde-soft:#DEF6ED;
    --amber:#F2A93B; --amber-soft:#FCEBD1; --border:#E2DDD6; --muted:#928D88; --azul:#2F6FE0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--areia);font-family:'Poppins',-apple-system,Segoe UI,Roboto,sans-serif;color:var(--dark);}
  #app{max-width:1240px;margin:0 auto;padding:16px 16px 60px;}

  .header{background:var(--coral);border-radius:18px;padding:16px 20px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .header-title{color:var(--white);font-weight:800;font-size:20px;}
  .header-sub{color:rgba(255,255,255,.85);font-weight:500;font-size:11.5px;margin-top:2px;}
  .header-brand{display:flex;flex-direction:column;align-items:center;gap:1px;flex-shrink:0;}
  .header-brand-logo{height:22px;width:auto;display:block;}
  .header-brand-sub{color:rgba(255,255,255,.9);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;}

  .tabs{display:flex;background:var(--white);border:1px solid var(--border);border-radius:14px;padding:4px;margin-bottom:16px;gap:4px;}
  .tab-btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;font-size:13.5px;font-family:inherit;cursor:pointer;background:transparent;color:var(--grafite);}
  .tab-btn.active{background:var(--dark);color:var(--white);}

  .card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;}
  .card-title{font-size:14px;font-weight:800;color:var(--dark);margin-bottom:12px;display:flex;align-items:center;gap:8px;}

  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;min-width:130px;}
  .field label{font-size:10.5px;font-weight:700;color:var(--grafite);text-transform:uppercase;letter-spacing:.02em;}
  .input, select.input, textarea.input{padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);font-size:13px;font-family:inherit;color:var(--dark);outline:none;background:var(--white);}
  .input:focus, select.input:focus, textarea.input:focus{border-color:var(--coral);}
  .btn{padding:9px 16px;border:none;border-radius:9px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;}
  .btn-primary{background:var(--coral);color:var(--white);}
  .btn-primary:hover{background:#EF463B;}
  .btn-ghost{background:var(--areia);color:var(--grafite);}
  .btn-ghost:hover{background:var(--border);}
  .btn-danger{background:var(--coral-soft);color:var(--coral);}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:7px;}

  .week-nav{display:flex;align-items:center;gap:10px;}
  .week-nav-btn{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--border);background:var(--white);font-size:16px;font-weight:800;cursor:pointer;color:var(--grafite);}
  .week-label{font-size:14px;font-weight:800;color:var(--dark);min-width:170px;text-align:center;}
  .week-range{font-size:10.5px;color:var(--muted);text-align:center;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{background:var(--areia);color:var(--grafite);font-size:10px;text-transform:uppercase;letter-spacing:.03em;font-weight:800;padding:9px 8px;text-align:left;position:sticky;top:0;}
  tbody td{padding:9px 8px;border-bottom:1px solid var(--areia);vertical-align:top;}
  tbody tr:hover{background:#FAF8F6;}
  .table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border);}

  .status-badge{display:inline-block;padding:4px 9px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap;}
  .status-Pendente{background:var(--amber-soft);color:#8a5a10;}
  .status-Em.andamento, .status-Em_andamento{background:#E3ECFB;color:#2551A8;}
  .status-Concluída, .status-Concluida{background:var(--verde-soft);color:#0d7a5f;}
  .status-Cancelada{background:var(--coral-soft);color:var(--coral);}

  .empty-state{text-align:center;padding:50px 20px;color:var(--muted);}

  /* ---- Layout "semana lado a lado" (colunas estilo kanban) ---- */
  .week-grid{display:flex;gap:10px;align-items:flex-start;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;}

  .day-name{font-size:11.5px;font-weight:800;color:var(--dark);text-transform:uppercase;letter-spacing:.03em;line-height:1.25;}
  .day-date{font-size:10.5px;color:var(--muted);font-weight:600;}
  .day-count{margin-left:auto;font-size:10px;font-weight:700;color:var(--grafite);background:var(--white);padding:3px 8px;border-radius:20px;flex-shrink:0;}
  .day-empty{font-size:11.5px;color:var(--muted);font-style:italic;padding:4px 2px 2px;}

  .day-hh{padding:0 2px 9px;border-bottom:2px solid var(--border);margin-bottom:9px;}
  .day-hh-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
  .day-hh-label{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;}
  .day-hh-value{font-size:11.5px;font-weight:800;}
  .day-hh-track{height:6px;border-radius:5px;background:var(--white);overflow:hidden;}
  .day-hh-fill{height:100%;border-radius:5px;transition:width .2s;}

  .activity-bullet{display:flex;flex-direction:column;gap:6px;padding:9px 9px 9px 9px;border-left:3px solid var(--coral);background:var(--white);border-radius:0 9px 9px 0;margin-bottom:8px;}
  .activity-bullet:last-child{margin-bottom:0;}
  .activity-bullet.status-line-Concluída, .activity-bullet.status-line-Concluida{border-left-color:var(--verde);}
  .activity-bullet.status-line-Cancelada{border-left-color:var(--muted);}
  .activity-bullet.status-line-Em.andamento, .activity-bullet.status-line-Em_andamento{border-left-color:#2551A8;}
  .activity-bullet-top{display:flex;gap:6px;align-items:flex-start;}
  .activity-bullet .dot{color:var(--coral);font-size:16px;line-height:1.2;flex-shrink:0;}
  .activity-main{flex:1;min-width:0;}
  .activity-desc{font-size:12.5px;font-weight:700;color:var(--dark);margin-bottom:5px;line-height:1.32;max-width:100%;word-break:break-word;overflow-wrap:anywhere;}
  .activity-id{color:var(--muted);font-weight:600;font-size:9.5px;margin-right:3px;}
  .activity-meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:0;font-size:11px;color:var(--grafite);max-width:100%;}
  .activity-meta span{max-width:100%;word-break:break-word;overflow-wrap:anywhere;}
  .activity-meta span:not(:last-child)::after{content:"·";margin:0 6px;color:var(--border);}
  .activity-bullet .row-actions{flex-shrink:0;flex-direction:column;align-items:center;gap:4px;}
  .activity-bullet .icon-row{display:flex;flex-direction:row;gap:4px;}
  .activity-bullet .icon-btn{width:20px;height:20px;font-size:10px;border-radius:5px;}
  .activity-bullet .status-badge{margin-top:2px;font-size:9.5px;padding:3px 7px;white-space:nowrap;}

  .status-dropdown-wrap{position:relative;display:inline-block;}
  .status-badge-btn{border:none;cursor:pointer;font-family:inherit;}
  .status-options{position:absolute;top:100%;right:0;margin-top:5px;background:var(--white);border:1px solid var(--border);border-radius:9px;box-shadow:0 6px 16px rgba(0,0,0,.14);z-index:60;min-width:128px;overflow:hidden;}
  .status-option{display:block;width:100%;text-align:left;padding:8px 11px;font-size:11.5px;font-weight:600;font-family:inherit;color:var(--grafite);background:var(--white);border:none;border-bottom:1px solid var(--areia);cursor:pointer;white-space:nowrap;}
  .status-option:last-child{border-bottom:none;}
  .status-option:hover{background:var(--areia);}
  .status-option.active{background:var(--areia);color:var(--dark);font-weight:800;}

  /* ---- Alerta: atividade sem data no Histórico ---- */
  .sem-data-alert{background:#F1EAFB;color:#5B2FB8;border:1px solid #D8C3F5;border-radius:9px;padding:8px 12px;font-size:12px;font-weight:700;margin-bottom:10px;}
  tr.row-sem-data{background:#F1EAFB !important;}
  tr.row-sem-data:hover{background:#E8DCF9 !important;}
  tr.row-sem-data td{color:#4A2A8C;}
  .sem-data-tag{display:inline-block;font-size:10.5px;font-weight:800;color:#5B2FB8;background:#E3D4F7;padding:3px 8px;border-radius:12px;white-space:nowrap;}

  @media(max-width:760px){
    .day-block{min-width:76vw;}
  }

  /* =========================================================
     Relatório PDF (impressão) — Programação Semanal
  ========================================================= */
  .print-report{display:none;}
  .pdf-header{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:3px solid var(--coral);padding-bottom:10px;margin-bottom:14px;}
  .pdf-title{font-size:19px;font-weight:800;color:var(--dark);}
  .pdf-subtitle{font-size:11.5px;color:var(--grafite);margin-top:2px;}
  .pdf-brand{font-size:10px;font-weight:700;color:var(--coral);text-transform:uppercase;letter-spacing:.04em;}
  .pdf-kpis{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .pdf-kpi{flex:1;min-width:85px;border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:10.5px;color:var(--grafite);text-align:center;}
  .pdf-kpi b{display:block;font-size:17px;color:var(--dark);margin-bottom:1px;}
  .pdf-day{margin-bottom:13px;break-inside:avoid;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .pdf-day-head{display:flex;justify-content:space-between;align-items:baseline;padding:7px 11px;font-size:11.5px;font-weight:800;color:var(--dark);}
  .pdf-day-head span:last-child{font-size:10px;font-weight:700;opacity:.75;}
  .pdf-day-empty{font-size:11px;color:var(--muted);font-style:italic;padding:7px 11px 9px;}
  .pdf-item{display:flex;justify-content:space-between;gap:10px;padding:6px 11px;border-top:1px dotted var(--border);font-size:11px;}
  .pdf-item-desc{font-weight:700;color:var(--dark);flex:1;}
  .pdf-item-meta{color:var(--grafite);font-size:10.5px;white-space:nowrap;flex-shrink:0;text-align:right;}
  .pdf-item .status-badge{font-size:9.5px;padding:2px 7px;vertical-align:middle;}
  .pdf-footer{margin-top:20px;padding-top:8px;border-top:1px solid var(--border);font-size:9px;color:var(--muted);text-align:center;}

  /* Faixa de separação dos dias — mesma cor para todos os blocos */
  .pdf-day-head{background:var(--areia);color:var(--dark);}

  @media print{
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact; }
    body > *:not(.print-report){ display:none !important; }
    .print-report{ display:block !important; }
    body{ background:#fff; }
    @page{ size:A4; margin:14mm; }
  }

  .modal-overlay{position:fixed;inset:0;background:rgba(24,24,24,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;}
  .modal{background:var(--white);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--white);border-radius:16px 16px 0 0;}
  .modal-head h3{margin:0;font-size:15px;font-weight:800;}
  .modal-close{background:var(--areia);border:none;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:15px;color:var(--grafite);}
  .modal-body{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-body .full{grid-column:1/-1;}
  .modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--border);}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:var(--white);padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:1200;opacity:0;pointer-events:none;transition:opacity .25s;}
  .toast.show{opacity:1;}

  .row-actions{display:flex;gap:6px;white-space:nowrap;}
  .icon-btn{width:28px;height:28px;border-radius:7px;border:none;background:var(--areia);color:var(--grafite);cursor:pointer;font-size:13px;}
  .icon-btn:hover{background:var(--border);}
  .icon-btn.danger:hover{background:var(--coral-soft);color:var(--coral);}

  .summary-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .summary-chip{flex:1;min-width:110px;background:var(--white);border:1px solid var(--border);border-radius:12px;padding:10px 12px;}
  .summary-chip .n{font-size:20px;font-weight:800;color:var(--dark);}
  .summary-chip .l{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;}

  @media(max-width:640px){
    .modal-body{grid-template-columns:1fr;}
    .filters{flex-direction:column;align-items:stretch;}
    .field{width:100%;}
  }
</style>

<body>
<div id="app"></div>
<div id="print-report" class="print-report"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
/* =========================================================
   Config / dados de referência
========================================================= */
const STATUS_OPTS = ["Pendente","Em andamento","Concluída","Cancelada"];
const LOCAL_OPTS  = ["VDB 1","VDB 2","VDB 3","Outro"];

/* Conexão com o Supabase — chave pública (publishable): pode ficar no código.
   A proteção dos dados é feita pelas regras RLS no banco (002_policies.sql). */
const SUPABASE_URL = "https://wzgzxynzbddysoezwmtl.supabase.co";
const SUPABASE_KEY = "sb_publishable_kNh09fjupJ6lme8NrSp9Dw_cqMZjSYM";

/* ---- Semana ISO 8601: retorna {year, week} a partir de uma data ---- */
function isoWeekOf(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr + "T00:00:00");
  if(isNaN(d)) return null;
  const target = new Date(d.valueOf());
  const dayNr = (d.getDay() + 6) % 7; // segunda=0 ... domingo=6
  target.setDate(target.getDate() - dayNr + 3); // quinta-feira da semana
  const firstThursday = new Date(target.getFullYear(), 0, 4);
  const diff = target - firstThursday;
  const week = 1 + Math.round(diff / (7*24*3600*1000));
  return { year: target.getFullYear(), week };
}
function isoWeekLabel(dateStr){
  const w = isoWeekOf(dateStr);
  return w ? `${w.year}-W${String(w.week).padStart(2,"0")}` : "—";
}
/* Datas de início/fim (seg-dom) de uma semana ISO */
function weekRange(year, week){
  const simple = new Date(year, 0, 1 + (week-1)*7);
  const dow = simple.getDay();
  const monday = new Date(simple);
  if(dow <= 4) monday.setDate(simple.getDate() - simple.getDay() + 1);
  else monday.setDate(simple.getDate() + 8 - simple.getDay());
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  return { monday, sunday };
}
function fmtDate(d){
  return d.toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit" });
}
function fmtDateISO(d){
  return d.toISOString().slice(0,10);
}
function fmtDateBR(iso){
  if(!iso) return "—";
  const [y,m,d] = iso.split("-");
  return (y && m && d) ? `${d}/${m}/${y}` : iso;
}
function currentWeek(){ return isoWeekOf(new Date().toISOString().slice(0,10)); }

/* =========================================================
   Persistência
========================================================= */
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const COLUNAS = "id,descricao,local,n_pessoas,duracao_h,data_prevista,data_realizada,status,equipe";

/* Banco (snake_case, números) -> app (camelCase, strings, como na v7) */
function fromDb(r){
  return {
    id: String(r.id),
    descricao: r.descricao || "",
    local: r.local || "",
    nPessoas: r.n_pessoas == null ? "" : String(r.n_pessoas),
    duracao: r.duracao_h == null ? "" : String(Number(r.duracao_h)),
    dataPrevista: r.data_prevista || "",
    dataRealizada: r.data_realizada || "",
    status: r.status || "Pendente",
    equipe: r.equipe || "",
  };
}

/* App -> banco, com validação. Lança Error com mensagem amigável. */
function toDb(a){
  const nTxt = String(a.nPessoas ?? "").trim();
  const dTxt = String(a.duracao ?? "").trim();
  const n = nTxt === "" ? null : Number(nTxt);
  const d = dTxt === "" ? null : parseNumero(dTxt);
  if(n !== null && (!Number.isInteger(n) || n < 1)) throw new Error("Nº de pessoas deve ser um número inteiro a partir de 1.");
  if(d !== null && (isNaN(d) || d <= 0 || d >= 1000)) throw new Error("Duração deve ser um número de horas maior que zero.");
  return {
    descricao: (a.descricao || "").trim(),
    local: LOCAL_OPTS.includes(a.local) ? a.local : null,
    n_pessoas: n,
    duracao_h: d === null ? null : Math.round(d * 100) / 100,
    data_prevista: a.dataPrevista || null,
    data_realizada: a.dataRealizada || null,
    status: STATUS_OPTS.includes(a.status) ? a.status : "Pendente",
    equipe: (a.equipe || "").trim() || null,
  };
}

/* Lista todas as atividades ativas (paginado: a API devolve no máx. 1000 por vez) */
async function listarAtividades(){
  const PAGINA = 1000;
  const todas = [];
  for(let inicio = 0; ; inicio += PAGINA){
    const { data, error } = await db.from("atividades")
      .select(COLUNAS).eq("excluido", false).order("id")
      .range(inicio, inicio + PAGINA - 1);
    if(error) throw error;
    todas.push(...data);
    if(data.length < PAGINA) break;
  }
  return todas.map(fromDb);
}
async function criarAtividade(linha){
  const { data, error } = await db.from("atividades").insert(linha).select(COLUNAS).single();
  if(error) throw error;
  return fromDb(data);
}
async function atualizarAtividade(id, campos){
  const { data, error } = await db.from("atividades").update(campos).eq("id", Number(id)).select(COLUNAS).single();
  if(error) throw error;
  return fromDb(data);
}
/* Exclusão lógica: marca excluido = true; o registro continua no banco */
async function excluirAtividade(id){
  const { error } = await db.from("atividades").update({ excluido: true }).eq("id", Number(id));
  if(error) throw error;
}

function msgErro(e){
  const m = (e && (e.message || e.error_description)) || String(e);
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return "sem conexão com o banco de dados.";
  return m;
}

async function carregarDados(){
  state.carregando = true;
  state.erro = null;
  render();
  try { state.atividades = await listarAtividades(); }
  catch(e){ state.erro = msgErro(e); }
  finally { state.carregando = false; render(); }
}

function emptyAtividade(prefill){
  return {
    id: null,                    // gerado pelo banco ao salvar
    descricao: "",
    local: "",
    nPessoas: "",
    duracao: "",
    dataPrevista: prefill?.dataPrevista || "",
    dataRealizada: "",
    status: "Pendente",
    equipe: "",
  };
}

/* =========================================================
   Estado
========================================================= */
const state = {
  tab: "semana",
  atividades: [],
  carregando: true,            // busca inicial no banco
  erro: null,                  // mensagem se a carga falhar
  salvando: false,             // evita duplo clique no Salvar
  week: currentWeek(),         // {year, week} — semana em exibição na Página 1
  modal: null,                 // {mode:'add'|'edit', data:{...}}
  filtros: { texto:"", status:"", local:"", equipe:"", semana:"" },
  openStatusId: null,          // id da atividade cujo seletor de status está aberto
};

function esc(s){
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
let toastTimer = null;
function showToast(msg, ms = 2200){
  let el = document.getElementById("toast");
  if(!el){ el = document.createElement("div"); el.id="toast"; el.className="toast"; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), ms);
}

/* =========================================================
   Página 1 — Programação Semanal
========================================================= */
function atividadesDaSemana(){
  const { year, week } = state.week;
  return state.atividades.filter(a => {
    const w = isoWeekOf(a.dataPrevista) || isoWeekOf(a.dataRealizada);
    return w && w.year === year && w.week === week;
  });
}

function statusClass(status){
  return "status-" + status.replace(/\s+/g, "_").replace(/á/g,"a").replace(/ã/g,"a").replace(/í/g,"i");
}
function statusLineClass(status){
  return "status-line-" + status.replace(/\s+/g, "_");
}

/* =========================================================
   HH alocado (Homem-Hora) = n° de pessoas x duração, por dia
   Meta: 32 HH/dia (valor fixo, pode virar configurável depois)
========================================================= */
const META_HH_DIA = 32;

function parseNumero(valor){
  const s = (valor || "").toString().trim();
  if(!s) return NaN;
  const m = s.match(/(\d+(?:[.,]\d+)?)/);
  if(!m) return NaN;
  return parseFloat(m[1].replace(",", "."));
}
function calcHH(a){
  const pessoas = parseNumero(a.nPessoas);
  const horas = parseNumero(a.duracao);
  if(isNaN(pessoas) || isNaN(horas)) return 0;
  return pessoas * horas;
}
function fmtHH(n){
  return Number.isInteger(n) ? String(n) : n.toFixed(1).replace(".", ",");
}
function corHH(totalHH){
  if(totalHH > META_HH_DIA) return "var(--azul)";   // ultrapassou a meta
  if(totalHH === META_HH_DIA) return "var(--verde)"; // bateu a meta certinho
  if(totalHH >= META_HH_DIA * 0.75) return "var(--amber)";
  return "var(--coral)";
}

/* Data "de referência" de uma atividade para posicioná-la num dia da semana:
   usa a data prevista; se não houver, cai para a data realizada. */
function dataReferencia(a){
  return a.dataPrevista || a.dataRealizada || "";
}

/* Formata a duração para deixar explícito que é "horas" (ex: "4" -> "4h"),
   sem duplicar o "h" caso o usuário já tenha digitado algo como "4h" ou "4 horas". */
function formatDuracao(duracao){
  const d = (duracao || "").toString().trim();
  if(!d) return "—";
  if(/h\b|hora/i.test(d)) return d; // já tem alguma unidade escrita
  return d.replace(".", ",") + "h";
}

          <div class="activity-meta">
            <span>${esc(a.local) || "—"}</span>
            <span>${esc(a.nPessoas) || "—"}</span>
            <span>${esc(formatDuracao(a.duracao))}</span>
            <span>${esc(a.equipe) || "—"}</span>
          </div>
        </div>
        <div class="row-actions">
          <div class="icon-row">
            <button class="icon-btn" data-action="edit-atividade" data-id="${a.id}" title="Editar">✎</button>
            <button class="icon-btn danger" data-action="delete-atividade" data-id="${a.id}" title="Excluir">🗑</button>
          </div>

            ${state.openStatusId === a.id ? `
              <div class="status-options">
                ${STATUS_OPTS.map(s => `<button class="status-option ${s===a.status?'active':''}" data-action="set-status-inline" data-id="${a.id}" data-status="${s}">${s}</button>`).join("")}

}

/* =========================================================
   Exportação em PDF — Programação Semanal (via impressão do navegador)
========================================================= */
function buildPdfSemanaHtml(){
  const { year, week } = state.week;
  const { monday, sunday } = weekRange(year, week);
  const lista = atividadesDaSemana();
  const counts = STATUS_OPTS.reduce((acc,s) => { acc[s] = lista.filter(a=>a.status===s).length; return acc; }, {});

  const DIAS = ["Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira"];

  function pdfItemHtml(a){
    return `
      <div class="pdf-item">
        <div class="pdf-item-desc">${esc(a.descricao) || "(sem descrição)"}</div>
        <div class="pdf-item-meta">${esc(a.local)||"—"} · ${esc(a.nPessoas)||"—"} pessoas · ${esc(formatDuracao(a.duracao))} · ${esc(a.equipe)||"—"} · <span class="status-badge ${statusClass(a.status)}">${esc(a.status)}</span></div>
      </div>
    `;
  }

  const diasHtml = DIAS.map((nome, i) => {
    const dia = new Date(monday);
    dia.setDate(monday.getDate() + i);
    const diaISO = fmtDateISO(dia);
    const atividadesDoDia = lista
      .filter(a => dataReferencia(a) === diaISO)
      .sort((a,b) => (a.descricao||"").localeCompare(b.descricao||"", "pt-BR"));
    const totalHH = atividadesDoDia.reduce((soma,a) => soma + calcHH(a), 0);

    const itemsHtml = atividadesDoDia.length === 0
      ? `<div class="pdf-day-empty">Nenhuma atividade prevista.</div>`
      : atividadesDoDia.map(pdfItemHtml).join("");

    return `
      <div class="pdf-day">
        <div class="pdf-day-head">
          <span>${nome} · ${fmtDate(dia)}</span>
          <span>${atividadesDoDia.length} ativ. · ${fmtHH(totalHH)}/${META_HH_DIA} HH</span>
        </div>
        ${itemsHtml}
      </div>
    `;
  }).join("");

  // Atividades sem data ou caindo no fim de semana desta semana ISO — listadas à parte,
  // para não desaparecer do relatório mesmo sem um dia útil correspondente.
  const diasIso = [0,1,2,3,4].map(i => { const dd = new Date(monday); dd.setDate(monday.getDate()+i); return fmtDateISO(dd); });
  const fimDeSemana = lista
    .filter(a => !diasIso.includes(dataReferencia(a)))
    .sort((a,b) => (a.descricao||"").localeCompare(b.descricao||"", "pt-BR"));
  const fimDeSemanaHtml = fimDeSemana.length === 0 ? "" : `
    <div class="pdf-day">
      <div class="pdf-day-head"><span>Sáb / Dom / sem data</span><span>${fimDeSemana.length} ativ.</span></div>
      ${fimDeSemana.map(pdfItemHtml).join("")}
    </div>
  `;

  return `
    <div class="pdf-header">
      <div>
        <div class="pdf-brand">Serena Energia · Gestão de Ativos</div>
        <div class="pdf-title">Programação Semanal de Atividades</div>
        <div class="pdf-subtitle">Semana ${week} / ${year} · ${fmtDate(monday)} a ${fmtDate(sunday)}</div>
      </div>
    </div>
    <div class="pdf-kpis">
      <div class="pdf-kpi"><b>${lista.length}</b>Atividades</div>
      ${STATUS_OPTS.map(s => `<div class="pdf-kpi"><b>${counts[s]}</b>${esc(s)}</div>`).join("")}
    </div>
    ${diasHtml}
    ${fimDeSemanaHtml}
    <div class="pdf-footer">Serena Energia · Gestão de Ativos — Gerado em ${new Date().toLocaleString("pt-BR")}</div>
  `;
}

function generatePdfSemana(){
  const container = document.getElementById("print-report");
  container.innerHTML = buildPdfSemanaHtml();
  setTimeout(() => window.print(), 80);
}

function renderSemana(){
  const { year, week } = state.week;
  const { monday, sunday } = weekRange(year, week);
  const lista = atividadesDaSemana();

  const counts = STATUS_OPTS.reduce((acc,s) => { acc[s] = lista.filter(a=>a.status===s).length; return acc; }, {});

  // Seg a Sex: 5 dias a partir da segunda-feira da semana em exibição
  const DIAS = ["Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira"];
  const diasHtml = DIAS.map((nome, i) => {
    const dia = new Date(monday);
    dia.setDate(monday.getDate() + i);
    const diaISO = fmtDateISO(dia);
    const atividadesDoDia = lista
      .filter(a => dataReferencia(a) === diaISO)
      .sort((a,b) => (a.descricao||"").localeCompare(b.descricao||"", "pt-BR"));

    const totalHH = atividadesDoDia.reduce((soma, a) => soma + calcHH(a), 0);
    const pctHH = Math.min(100, Math.round((totalHH / META_HH_DIA) * 100));
    const cor = corHH(totalHH);

    return `
      <div class="day-block">
        <div class="day-head">
          <div class="day-head-text">
            <span class="day-name">${nome}</span>
            <span class="day-date">${fmtDate(dia)}</span>
          </div>
          <span class="day-count">${atividadesDoDia.length}</span>
          <button class="icon-btn" style="margin-left:2px;" data-action="open-add" data-prevdate="${diaISO}" title="Nova atividade neste dia">+</button>
        </div>
        <div class="day-hh">
          <div class="day-hh-top">
            <span class="day-hh-label">HH alocado</span>
            <span class="day-hh-value" style="color:${cor}">${fmtHH(totalHH)} / ${META_HH_DIA}</span>
          </div>
          <div class="day-hh-track"><div class="day-hh-fill" style="width:${pctHH}%;background:${cor}"></div></div>
        </div>
        ${atividadesDoDia.length === 0
          ? `<div class="day-empty">Nenhuma atividade prevista.</div>`
          : atividadesDoDia.map(activityBulletHtml).join("")
        }
      </div>
    `;
  }).join("");

  // Atividades cuja data de referência cai no sábado/domingo dessa mesma semana ISO
  // (a semana vai de seg a dom; essas não entram nos blocos Seg-Sex acima, mas
  // continuam contabilizadas no resumo, então são listadas à parte).
  const fimDeSemana = lista
    .filter(a => {
      const ref = dataReferencia(a);
      if(!ref) return true; // sem data definida também cai aqui, pra não sumir
      const d = new Date(ref + "T00:00:00");
      const refISO = fmtDateISO(d);
      const diasIso = [0,1,2,3,4].map(i => { const dd = new Date(monday); dd.setDate(monday.getDate()+i); return fmtDateISO(dd); });
      return !diasIso.includes(refISO);
    })
    .sort((a,b) => (a.descricao||"").localeCompare(b.descricao||"", "pt-BR"));
  const fimDeSemanaHtml = fimDeSemana.length === 0 ? "" : `
    <div class="day-block">
      <div class="day-head">
        <span class="day-name">Sáb / Dom / sem data</span>
        <span class="day-count">${fimDeSemana.length}</span>
      </div>
      ${fimDeSemana.map(activityBulletHtml).join("")}
    </div>
  `;

  return `
    <div class="card">
      <div class="card-title">📅 Filtro por semana do ano</div>
      <div class="week-nav">
        <button class="week-nav-btn" data-action="week-prev">‹</button>
        <div>
          <div class="week-label">Semana ${week} / ${year}</div>
          <div class="week-range">${fmtDate(monday)} a ${fmtDate(sunday)}</div>
        </div>
        <button class="week-nav-btn" data-action="week-next">›</button>
        <button class="btn btn-ghost btn-sm" data-action="week-today" style="margin-left:8px;">Semana atual</button>
        <span style="flex:1"></span>
        <input class="input" type="week" style="width:150px;" value="${year}-W${String(week).padStart(2,"0")}" data-action="week-pick" />
      </div>
    </div>

    <div class="summary-row">
      <div class="summary-chip"><div class="n">${lista.length}</div><div class="l">Atividades</div></div>
      ${STATUS_OPTS.map(s => `<div class="summary-chip"><div class="n">${counts[s]}</div><div class="l">${esc(s)}</div></div>`).join("")}
    </div>

    <div class="card">
      <div class="card-title" style="justify-content:space-between;">
        <span>🗂️ Atividades da semana (Seg a Sex)</span>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-ghost btn-sm" data-action="export-pdf-semana">🖨️ Exportar PDF</button>
          <button class="btn btn-primary btn-sm" data-action="open-add" data-prevdate="${fmtDateISO(monday)}">+ Nova atividade</button>
        </div>
      </div>
      <div class="week-grid">${diasHtml}</div>
      ${fimDeSemanaHtml}
    </div>
  `;
}

/* =========================================================
   Página 2 — Histórico (banco de dados completo, editável)
========================================================= */
function locaisDistintos(){
  return LOCAL_OPTS.slice();
}
function equipesDistintas(){
  return Array.from(new Set(state.atividades.map(a => a.equipe).filter(Boolean))).sort((a,b) => a.localeCompare(b,"pt-BR"));
}
function semanasDistintas(){
  const set = new Set();
  state.atividades.forEach(a => {
    const w = isoWeekOf(a.dataPrevista) || isoWeekOf(a.dataRealizada);
    if(w) set.add(`${w.year}-W${String(w.week).padStart(2,"0")}`);
  });
  return Array.from(set).sort();
}

/* Atividade cadastrada sem nenhuma data (nem prevista, nem realizada) —
   precisa ser destacada no histórico para a pessoa completar depois. */
function semDataDefinida(a){
  return !a.dataPrevista && !a.dataRealizada;
}

function atividadesFiltradas(){
  const f = state.filtros;
  return state.atividades.filter(a => {
    if(f.status && a.status !== f.status) return false;
    if(f.local && a.local !== f.local) return false;
    if(f.equipe && a.equipe !== f.equipe) return false;
    if(f.semana){
      const w = isoWeekOf(a.dataPrevista) || isoWeekOf(a.dataRealizada);
      const label = w ? `${w.year}-W${String(w.week).padStart(2,"0")}` : "";
      if(label !== f.semana) return false;
    }
    if(f.texto){
      const t = f.texto.toLowerCase();
      const blob = [a.descricao,a.local,a.equipe,a.status].join(" ").toLowerCase();
      if(!blob.includes(t)) return false;
    }
    return true;
  }).sort((a,b) => (b.dataPrevista||"").localeCompare(a.dataPrevista||""));
}

/* =========================================================
   Exportação em CSV — lista filtrada do Histórico
========================================================= */
function csvEscape(valor){
  const s = String(valor ?? "");
  // Envolve em aspas se houver vírgula, aspas ou quebra de linha; "" escapa aspas internas.
  if(/[",;\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function exportCsvHistorico(){
  const lista = atividadesFiltradas();
  if(lista.length === 0){ showToast("Nenhuma atividade para exportar com os filtros atuais."); return; }

  const headers = ["ID","Descrição","Local","Nº pessoas","Duração (h)","Data prevista","Data realizada","Semana","Status","Equipe"];
  const linhas = lista.map(a => {
    const semanaLabel = isoWeekLabel(a.dataPrevista) !== "—" ? isoWeekLabel(a.dataPrevista) : isoWeekLabel(a.dataRealizada);
    return [
      a.id, a.descricao, a.local, a.nPessoas, String(a.duracao || "").replace(".", ","),
      fmtDateBR(a.dataPrevista), fmtDateBR(a.dataRealizada),
      semanaLabel, a.status, a.equipe,
    ].map(csvEscape).join(";");
  });

  // ";" como separador (padrão do Excel em pt-BR) + BOM UTF-8 pra acentos abrirem certo.
  const csv = "\uFEFF" + headers.map(csvEscape).join(";") + "\n" + linhas.join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const dataArquivo = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `historico_atividades_${dataArquivo}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`${lista.length} atividade(s) exportada(s) ✓`);
}

function renderHistorico(){
  const lista = atividadesFiltradas();
  const locais = locaisDistintos();
  const equipes = equipesDistintas();
  const semanas = semanasDistintas();

  const semData = lista.filter(semDataDefinida).length;

  const rowsHtml = lista.length === 0 ? "" : lista.map(a => {
    const semanaLabel = isoWeekLabel(a.dataPrevista) !== "—" ? isoWeekLabel(a.dataPrevista) : isoWeekLabel(a.dataRealizada);
    const faltaData = semDataDefinida(a);
    return `
    <tr class="${faltaData ? 'row-sem-data' : ''}" ${faltaData ? 'title="Atividade sem data prevista nem realizada"' : ''}>
      <td style="font-weight:700;color:${'#928D88'}">#${esc(a.id)}</td>
      <td style="max-width:200px;">${esc(a.descricao) || "—"}</td>
      <td>${esc(a.local) || "—"}</td>
      <td>${esc(a.nPessoas) || "—"}</td>
      <td>${esc(formatDuracao(a.duracao))}</td>
      <td>${faltaData ? `<span class="sem-data-tag">⚠ Sem data</span>` : fmtDateBR(a.dataPrevista)}</td>
      <td>${fmtDateBR(a.dataRealizada)}</td>
      <td>${esc(semanaLabel)}</td>
      <td><span class="status-badge ${statusClass(a.status)}">${esc(a.status)}</span></td>
      <td>${esc(a.equipe) || "—"}</td>
      <td>
        <div class="row-actions">
          <button class="icon-btn" data-action="edit-atividade" data-id="${a.id}" title="Editar">✎</button>
          <button class="icon-btn danger" data-action="delete-atividade" data-id="${a.id}" title="Excluir">🗑</button>
        </div>
      </td>
    </tr>
  `;
  }).join("");

  return `
    <div class="card">
      <div class="card-title">🔎 Filtros</div>
      <div class="filters">
        <div class="field" style="min-width:200px;">
          <label>Buscar</label>
          <input class="input" type="text" placeholder="Descrição, local, equipe..." value="${esc(state.filtros.texto)}" data-action="filter-texto" />
        </div>
        <div class="field">
          <label>Status</label>
          <select class="input" data-action="filter-status">
            <option value="">Todos</option>
            ${STATUS_OPTS.map(s => `<option value="${s}" ${state.filtros.status===s?"selected":""}>${s}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>Local</label>
          <select class="input" data-action="filter-local">
            <option value="">Todos</option>
            ${locais.map(l => `<option value="${esc(l)}" ${state.filtros.local===l?"selected":""}>${esc(l)}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>Equipe</label>
          <select class="input" data-action="filter-equipe">
            <option value="">Todas</option>
            ${equipes.map(e => `<option value="${esc(e)}" ${state.filtros.equipe===e?"selected":""}>${esc(e)}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>Semana</label>
          <select class="input" data-action="filter-semana">
            <option value="">Todas</option>
            ${semanas.map(s => `<option value="${s}" ${state.filtros.semana===s?"selected":""}>${s}</option>`).join("")}
          </select>
        </div>
        <button class="btn btn-ghost" data-action="clear-filters">Limpar filtros</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title" style="justify-content:space-between;">
        <span>📚 Histórico de atividades (${lista.length} de ${state.atividades.length})</span>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-ghost btn-sm" data-action="export-csv-historico" ${lista.length===0 ? "disabled" : ""}>⬇️ Exportar CSV</button>
          <button class="btn btn-primary btn-sm" data-action="open-add">+ Nova atividade</button>
        </div>
      </div>
      ${semData > 0 ? `
        <div class="sem-data-alert">⚠ ${semData} atividade${semData>1?'s':''} sem nenhuma data preenchida — destacada${semData>1?'s':''} em roxo abaixo.</div>
      ` : ""}
      ${lista.length === 0 ? `
        <div class="empty-state">

        <div class="table-wrap">

          <div class="field">
            <label>Data realizada</label>
            <input class="input" type="date" value="${esc(a.dataRealizada)}" data-field="dataRealizada" />
          </div>
          <div class="field full">
            <label>Status</label>
            <select class="input" data-field="status">
              ${STATUS_OPTS.map(s => `<option value="${s}" ${a.status===s?"selected":""}>${s}</option>`).join("")}
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" data-action="close-modal">Cancelar</button>
          <button class="btn btn-primary" data-action="save-modal">Salvar</button>
        </div>
      </div>
    </div>
  `;
}

/* =========================================================
   Render principal
========================================================= */
function renderConteudo(){
  if(state.carregando && state.atividades.length === 0){
    return `<div class="card"><div class="empty-state"><div class="big">Carregando atividades…</div><div>Conectando ao banco de dados.</div></div></div>`;
  }
  if(state.erro){
    return `<div class="card"><div class="empty-state">
      <div class="big">Não foi possível carregar as atividades</div>
      <div>${esc(state.erro)}</div>
      <div style="margin-top:14px;"><button class="btn btn-primary" data-action="recarregar">Tentar novamente</button></div>
    </div></div>`;
  }
  return state.tab === "semana" ? renderSemana() : renderHistorico();
}

/* =========================================================
   Listeners
========================================================= */
function attachListeners(){
  document.querySelectorAll(".modal").forEach(m => m.addEventListener("click", e => e.stopPropagation()));

  document.querySelectorAll("[data-action]").forEach(el => {
    const action = el.getAttribute("data-action");

    if(action === "set-tab"){
      el.addEventListener("click", () => { state.tab = el.getAttribute("data-tab"); render(); });
    }
    if(action === "week-prev"){
      el.addEventListener("click", () => {
        const { monday } = weekRange(state.week.year, state.week.week);
        monday.setDate(monday.getDate() - 7);
        state.week = isoWeekOf(fmtDateISO(monday));
        render();
      });
    }
    if(action === "week-next"){
      el.addEventListener("click", () => {
        const { monday } = weekRange(state.week.year, state.week.week);
        monday.setDate(monday.getDate() + 7);
        state.week = isoWeekOf(fmtDateISO(monday));
        render();
      });
    }
    if(action === "week-today"){
      el.addEventListener("click", () => { state.week = currentWeek(); render(); });
    }
    if(action === "week-pick"){
      el.addEventListener("change", () => {
        const val = el.value; // formato yyyy-Www
        const m = val.match(/^(\d{4})-W(\d{2})$/);
        if(m) state.week = { year: parseInt(m[1],10), week: parseInt(m[2],10) };
        render();
      });
    }
    if(action === "export-pdf-semana"){
      el.addEventListener("click", generatePdfSemana);
    }
    if(action === "export-csv-historico"){
      el.addEventListener("click", exportCsvHistorico);
    }
    if(action === "open-add"){
      el.addEventListener("click", () => {
        const prevdate = el.getAttribute("data-prevdate") || "";
        state.modal = { mode:"add", data: emptyAtividade({ dataPrevista: prevdate }) };
        render();
      });
    }
    if(action === "edit-atividade"){
      el.addEventListener("click", () => {
        const id = el.getAttribute("data-id");
        const a = state.atividades.find(x => x.id === id);
        if(a) { state.modal = { mode:"edit", data: { ...a } }; render(); }
      });
    }
    if(action === "recarregar"){
      el.addEventListener("click", carregarDados);
    }
    if(action === "delete-atividade"){
      el.addEventListener("click", async () => {
        const id = el.getAttribute("data-id");
        if(!confirm("Excluir esta atividade? Ela sai da lista, mas continua guardada no banco e pode ser recuperada.")) return;
        try {
          await excluirAtividade(id);
          state.atividades = state.atividades.filter(x => x.id !== id);
          showToast("Atividade excluída.");
        } catch(e){
          showToast("Erro ao excluir: " + msgErro(e), 5000);
        }
        render();
      });
    }
    if(action === "toggle-status-dropdown"){
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        state.openStatusId = state.openStatusId === id ? null : id;
        render();
      });
    }
    if(action === "set-status-inline"){
      el.addEventListener("click", async (e) => {
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        const novoStatus = el.getAttribute("data-status");
        const a = state.atividades.find(x => x.id === id);
        state.openStatusId = null;
        if(a && a.status !== novoStatus){
          try {
            Object.assign(a, await atualizarAtividade(id, { status: novoStatus }));
            showToast("Status atualizado ✓");
          } catch(err){
            showToast("Erro ao atualizar status: " + msgErro(err), 5000);
          }
        }
        render();
      });
    }
    if(action === "close-modal"){
      el.addEventListener("click", () => { state.modal = null; render(); });
    }
    if(action === "save-modal"){
      el.addEventListener("click", async () => {
        if(state.salvando) return;
        const data = { ...state.modal.data };
        document.querySelectorAll("[data-field]").forEach(f => {
          data[f.getAttribute("data-field")] = f.value;
        });
        state.modal.data = data;   // preserva o que foi digitado se der erro
        if(!data.descricao.trim()){ showToast("Informe a descrição da atividade."); return; }
        let linha;
        try { linha = toDb(data); } catch(e){ showToast(e.message, 4000); return; }

        state.salvando = true;
        el.disabled = true;
        el.textContent = "Salvando…";
        try {
          if(data.id){
            const atual = await atualizarAtividade(data.id, linha);
            const idx = state.atividades.findIndex(x => x.id === data.id);
            if(idx >= 0) state.atividades[idx] = atual; else state.atividades.push(atual);
          } else {
            state.atividades.push(await criarAtividade(linha));
          }
          state.modal = null;
          showToast("Atividade salva ✓");
        } catch(e){
          showToast("Erro ao salvar: " + msgErro(e), 5000);
        } finally {
          state.salvando = false;
          render();
        }
      });
    }
    // filtros do histórico
    if(action === "filter-texto"){
      el.addEventListener("input", () => {
        state.filtros.texto = el.value;
        const pos = el.selectionStart;
        render();
        const again = document.querySelector('[data-action="filter-texto"]');
        if(again){ again.focus(); again.setSelectionRange(pos, pos); }
      });
    }
    if(action === "filter-status"){
      el.addEventListener("change", () => { state.filtros.status = el.value; render(); });
    }
    if(action === "filter-local"){
      el.addEventListener("change", () => { state.filtros.local = el.value; render(); });
    }
    if(action === "filter-equipe"){
      el.addEventListener("change", () => { state.filtros.equipe = el.value; render(); });
    }
    if(action === "filter-semana"){
      el.addEventListener("change", () => { state.filtros.semana = el.value; render(); });
    }
    if(action === "clear-filters"){
      el.addEventListener("click", () => { state.filtros = { texto:"", status:"", local:"", equipe:"", semana:"" }; render(); });
    }
  });
}

/* Fecha o seletor de status ao clicar fora dele (listener global, único) */
document.addEventListener("click", (e) => {
  if(state.openStatusId !== null && !e.target.closest(".status-dropdown-wrap")){
    state.openStatusId = null;
    render();
  }
});

render();
carregarDados();
</script>
<script>
  /* Registra o service worker (necessário para instalar como app) */
  if("serviceWorker" in navigator){
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
  }
</script>
</body>
</html>
